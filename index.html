<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="description" content="BandPlan — операционная система музыкальной группы: календарь, песни с аккордами и динамикой, сет-листы, группы, сценический режим. Offline-first PWA.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BandPlan">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>BandPlan — Music Group OS</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-800-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-400-normal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/fontsource/fonts/jetbrains-mono@latest/latin-700-normal.css">
<link id="appIcon" rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236366f1'/%3E%3Cpath d='M26 44V20l18-3v24' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='44' r='5' fill='white'/%3E%3Ccircle cx='39' cy='41' r='5' fill='white'/%3E%3C/svg%3E">
<link id="appleTouchIcon" rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236366f1'/%3E%3Cpath d='M26 44V20l18-3v24' stroke='white' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='21' cy='44' r='5' fill='white'/%3E%3Ccircle cx='39' cy='41' r='5' fill='white'/%3E%3C/svg%3E">
<link id="appManifest" rel="manifest" href="">
<link rel="stylesheet" href="bandplan.css">
<script src="bandplan.js" defer></script>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar" aria-label="Навигация">
    <div class="sidebar-header">
      <a class="brand" href="#/calendar"><span class="brand-icon">🎵</span><span class="brand-name">BandPlan</span></a>
    </div>
    <nav class="nav">
      <a class="nav-item" href="#/calendar" data-tab="calendar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="5" width="17.6" height="15.8" rx="3"/><path d="M3.2 10h17.6M8.2 3.2v3.6M15.8 3.2v3.6"/></svg>
        <span>Главная</span><em class="nav-count" id="navCountEvents"></em></a>
      <a class="nav-item" href="#/songs" data-tab="songs">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.4l11-1.8V16"/><circle cx="6.2" cy="18" r="2.8"/><circle cx="17.2" cy="16" r="2.8"/></svg>
        <span>Песни</span><em class="nav-count" id="navCountSongs"></em></a>
      <a class="nav-item" href="#/band" data-tab="band">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.4 6.4h12M8.4 12h12M8.4 17.6h12"/><path d="M3.8 6.4h.01M3.8 12h.01M3.8 17.6h.01"/></svg>
        <span>Сет-листы и группы</span><em class="nav-count" id="navCountSets"></em></a>
      <a class="nav-item" href="#/scene" data-tab="scene">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.6" y="4.2" width="18.8" height="12.6" rx="3"/><path d="M8.4 20.6h7.2M12 16.8v3.8"/></svg>
        <span>Сцена</span></a>
      <a class="nav-item" href="#/more" data-tab="more">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5.2" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18.8" r="1.5"/></svg>
        <span>Ещё</span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn theme-quick-toggle" id="themeQuickToggle" type="button">
        <span class="tq-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span>
        <span id="themeLabel">Тёмная тема</span></button>
      <button class="btn install-side-btn" id="installSideBtn" type="button" hidden>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 10 12 14.5 16.5 10M4.5 19.5h15"/></svg>
        <span>Установить</span></button>
      <div class="shortcuts-hint"><kbd>Ctrl</kbd><kbd>K</kbd><kbd>Esc</kbd><kbd>◄</kbd><kbd>►</kbd><kbd>+</kbd><kbd>−</kbd><kbd>⛶</kbd></div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-search" id="globalSearchWrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20.2 20.2-3.7-3.7"/></svg>
        <input type="search" id="globalSearch" placeholder="Поиск: песни, события, группы, участники…" aria-label="Глобальный поиск" autocomplete="off" spellcheck="false">
        <kbd>Ctrl K</kbd>
      </div>
      <button class="icon-btn" id="cmdPaletteBtn" type="button" aria-label="Палитра команд (Ctrl+K)">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v12a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3z"/></svg></button>
      <button class="icon-btn" id="installBtn" type="button" aria-label="Установить приложение" hidden>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 10 12 14.5 16.5 10M4.5 19.5h15"/></svg></button>
      <button class="icon-btn" id="themeQuickToggleTop" type="button" aria-label="Переключить тему">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </header>
    <main class="content" id="content" tabindex="-1" aria-live="polite">
      <div class="app-boot"><div class="loading-spinner"></div><p>Загрузка BandPlan…</p></div>
    </main>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Навигация">
  <a class="bnav-item" href="#/calendar" data-tab="calendar">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="5" width="17.6" height="15.8" rx="3"/><path d="M3.2 10h17.6M8.2 3.2v3.6M15.8 3.2v3.6"/></svg>
    <span>Главная</span><em class="bnav-badge" id="bnavBadgeEvents" hidden></em></a>
  <a class="bnav-item" href="#/songs" data-tab="songs">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5.4l11-1.8V16"/><circle cx="6.2" cy="18" r="2.8"/><circle cx="17.2" cy="16" r="2.8"/></svg>
    <span>Песни</span></a>
  <a class="bnav-item" href="#/band" data-tab="band">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.4 6.4h12M8.4 12h12M8.4 17.6h12"/><path d="M3.8 6.4h.01M3.8 12h.01M3.8 17.6h.01"/></svg>
    <span>Сет-листы</span></a>
  <a class="bnav-item" href="#/more" data-tab="more">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5.2" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="18.8" r="1.5"/></svg>
    <span>Ещё</span></a>
</nav>

<div class="install-banner" id="installBanner" hidden>
  <div class="install-banner-icon">📲</div>
  <div class="install-banner-text"><strong>Установите BandPlan</strong><span>Иконка на главном экране и работа без интернета</span></div>
  <div class="install-banner-actions">
    <button class="btn btn-sm btn-primary" type="button" data-act="install-app">Установить</button>
    <button class="btn btn-sm" type="button" data-act="install-dismiss">Позже</button>
  </div>
</div>

<div class="search-dropdown" id="searchDropdown" role="listbox"></div>
<div class="modal-overlay" id="modalOverlay"></div>
<div class="cmd-palette-overlay" id="cmdPaletteOverlay">
  <div class="cmd-palette" role="dialog" aria-modal="true" aria-label="Палитра команд">
    <div class="cmd-palette-input-wrap">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20.2 20.2-3.7-3.7"/></svg>
      <input id="cmdInput" type="text" placeholder="Команда, песня, событие, группа…" autocomplete="off" spellcheck="false">
      <kbd>Esc</kbd>
    </div>
    <div class="cmd-palette-results" id="cmdResults" role="listbox"></div>
  </div>
</div>

<div class="scene-overlay" id="sceneOverlay" role="dialog" aria-modal="true" aria-label="Сцена">
  <div class="scene-container">
    <div class="scene-header">
      <button class="scene-btn" id="scenePrev" type="button" aria-label="Предыдущая песня"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="scene-song-info" id="sceneSongInfo"></div>
      <button class="scene-btn" id="sceneNext" type="button" aria-label="Следующая песня"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
    <div class="scene-progress"><div class="scene-progress-bar" id="sceneProgressBar"></div></div>
    <div class="scene-lyrics" id="sceneLyrics" tabindex="0"></div>
    <div class="scene-controls">
      <button class="scene-ctrl-btn" id="sceneScroll" type="button" aria-label="Автопрокрутка">▶</button>
      <button class="scene-ctrl-btn" id="sceneSpeed" type="button" aria-label="Скорость">1×</button>
      <button class="scene-ctrl-btn" id="sceneFontDec" type="button" aria-label="Уменьшить шрифт">A−</button>
      <button class="scene-ctrl-btn" id="sceneFontInc" type="button" aria-label="Увеличить шрифт">A+</button>
      <button class="scene-ctrl-btn" id="sceneTransDec" type="button" aria-label="Транспонировать вниз">♭</button>
      <span class="scene-ctrl-val" id="sceneTransVal">0</span>
      <button class="scene-ctrl-btn" id="sceneTransInc" type="button" aria-label="Транспонировать вверх">♯</button>
      <button class="scene-ctrl-btn" id="sceneFullscreen" type="button" aria-label="Полный экран">⛶</button>
      <button class="scene-ctrl-btn scene-exit" id="sceneExit" type="button" aria-label="Выйти">✕</button>
    </div>
    <div class="scene-hints">◄ ► песни · Пробел прокрутка · + − шрифт · Esc выход</div>
  </div>
</div>

<div class="toast-container" id="toastContainer" role="status" aria-live="polite"></div>
<div id="printArea" aria-hidden="true"></div>
<input type="file" id="fileInput" multiple style="display:none" tabindex="-1">
<input type="file" id="importFile" accept=".json,application/json" style="display:none" tabindex="-1">
<noscript><div style="padding:40px;text-align:center;font-family:sans-serif"><h1>BandPlan</h1><p>Включите JavaScript для работы приложения.</p></div></noscript>
</body>
</html>
